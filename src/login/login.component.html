<div class="login-wrapper">
  <div class="login-card">
    <h2>Sign in</h2>

    <button
      class="ms-sso-btn"
      (click)="loginWithSSO()"
      [disabled]="loading"
    >
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg"
        alt="Microsoft logo"
      />
      <span>
        {{ loading ? 'Signing in…' : 'Sign in with Microsoft' }}
      </span>
    </button>
  </div>
</div>
